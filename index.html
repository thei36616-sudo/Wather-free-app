<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Погода</title>
<style>
@property --c1{syntax:"<color>";inherits:true;initial-value:#1e90ff}
@property --c2{syntax:"<color>";inherits:true;initial-value:#6dd5fa}
:root{--c1:#1e90ff;--c2:#6dd5fa;--tx:#fff;--mut:rgba(255,255,255,.72);--acc:#ffe27a;transition:--c1 1.2s,--c2 1.2s}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--c1)}
body{font-family:"Segoe UI",Roboto,system-ui,sans-serif;color:var(--tx);min-height:100vh;background:linear-gradient(160deg,var(--c1),var(--c2));background-attachment:fixed;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;width:420px;height:150px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(46px);opacity:0;transition:opacity 1.2s;animation:drift 60s linear infinite}
.cloud:nth-child(2){top:34%;width:520px;animation-duration:85s;animation-delay:-30s}
.cloud:nth-child(3){top:62%;width:380px;animation-duration:70s;animation-delay:-50s}
body.cloudy .cloud{opacity:.45}
@keyframes drift{from{transform:translateX(-60vw)}to{transform:translateX(130vw)}}
.orb{position:absolute;top:6%;right:8%;width:150px;height:150px;border-radius:50%;opacity:0;transition:opacity 1.2s;animation:pulse 5s ease-in-out infinite}
.sun{background:radial-gradient(circle,#fff6c9 0,#ffd54a 40%,rgba(255,213,74,0) 70%);box-shadow:0 0 120px 40px rgba(255,220,100,.45)}
.moon{background:radial-gradient(circle at 35% 35%,#fff 0,#dfe6ff 45%,rgba(223,230,255,0) 72%);box-shadow:0 0 90px 20px rgba(200,215,255,.3)}
body.sunny .sun,body.moony .moon{opacity:1}
@keyframes pulse{50%{transform:scale(1.08)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:1}
.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.7}20%{opacity:0}35%{opacity:.5}100%{opacity:0}}
main{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07));-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.3);box-shadow:0 10px 36px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.45);border-radius:26px}
.top{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;position:relative}
.top input{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:16px;padding:10px 0}
.top input::placeholder{color:var(--mut)}
.top input:focus{outline:0}
.top:focus-within{box-shadow:0 0 0 2px rgba(255,255,255,.65),0 10px 36px rgba(0,0,0,.18)}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;font-size:17px;cursor:pointer;transition:transform .2s,background .2s;flex:none}
.ib:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.ib:active{transform:scale(.92)}
.ib:focus-visible,.chip:focus-visible,.day:focus-visible{outline:3px solid #fff;outline-offset:2px}
.spin{animation:rot .8s linear}
@keyframes rot{to{transform:rotate(360deg)}}
#sug{list-style:none;padding:0;margin-top:8px;overflow:hidden;max-height:0;opacity:0;transition:max-height .35s,opacity .25s}
#sug.open{max-height:320px;opacity:1}
#sug li{padding:13px 18px;cursor:pointer;border-top:1px solid rgba(255,255,255,.15);transition:background .15s,padding-left .2s}
#sug li:first-child{border-top:0}
#sug li:hover,#sug li:focus{background:rgba(255,255,255,.2);padding-left:24px;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;flex:none;padding:8px 8px 8px 14px;border-radius:99px;font-size:14px;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);transition:background .2s,transform .2s;animation:pop .35s both}
.chip:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.chip.on{background:rgba(255,255,255,.34)}
.chip i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:rgba(0,0,0,.18)}
.chip i:hover{background:rgba(0,0,0,.4)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.hero{margin-top:12px;padding:26px 20px 22px;text-align:center;position:relative;transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.hero h1{font-size:21px;font-weight:600;display:inline-flex;gap:10px;align-items:center}
.star{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut);transition:transform .25s,color .2s}
.star:hover{transform:scale(1.25) rotate(12deg)}
.star.on{color:var(--acc)}
.ico{font-size:84px;line-height:1.2;display:inline-block;animation:bob 4.5s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.temp{font-size:104px;font-weight:200;line-height:1;letter-spacing:-4px;font-variant-numeric:tabular-nums}
.desc{font-size:20px;color:var(--mut)}
.hl{margin-top:8px;color:var(--mut)}
section{margin-top:14px;padding:16px}
h2{font-size:14px;font-weight:600;color:var(--mut);margin-bottom:12px}
.cw{position:relative;touch-action:pan-y;cursor:crosshair}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.ln{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ar{opacity:0;animation:fade .8s .5s forwards}
@keyframes fade{to{opacity:1}}
.tip{position:absolute;top:0;transform:translate(-50%,-6px);pointer-events:none;padding:8px 12px;border-radius:14px;font-size:13px;text-align:center;white-space:nowrap;transition:left .08s linear;background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25)}
.tip b{font-size:18px;display:block}
.xs{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:4px}
.days{display:flex;flex-direction:column;gap:4px}
.day{display:grid;grid-template-columns:76px 34px 1fr 96px;gap:10px;align-items:center;padding:11px 12px;border-radius:16px;border:1px solid transparent;background:none;color:#fff;font:inherit;cursor:pointer;text-align:left;transition:background .2s,border-color .2s,transform .2s}
.day:hover{background:rgba(255,255,255,.14);transform:translateX(3px)}
.day[aria-pressed=true]{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4)}
.day span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.rng{height:7px;border-radius:4px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}
.rng em{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#8fd0ff,var(--acc));transform-origin:left;animation:grow .8s both}
@keyframes grow{from{transform:scaleX(0)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid div{padding:14px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);transition:transform .25s,background .25s}
.grid div:hover{transform:translateY(-4px);background:rgba(255,255,255,.18)}
.grid small{display:block;color:var(--mut);font-size:13px}
.grid b{font-size:22px;font-weight:600}
.msg{text-align:center;padding:50px 20px;color:var(--mut)}
.sk{height:200px;border-radius:26px;margin-top:12px;background:linear-gradient(100deg,rgba(255,255,255,.08) 30%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.08) 70%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
@media(max-width:480px){.temp{font-size:88px}.day{grid-template-columns:62px 30px 1fr 86px;gap:8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ln{stroke-dashoffset:0}.ar{opacity:1}}

.i{width:1.2em;height:1.2em;flex:none;vertical-align:-.22em;stroke-width:1.7}
.i-sun{color:var(--acc)}.i-moon,.i-cloud-moon{color:#e4e9ff}
.ib .i,.ib [data-ic]{width:20px;height:20px;display:inline-grid;place-items:center}
.ib .i{vertical-align:middle}
.si{display:flex;color:var(--mut)}.si .i{width:20px;height:20px}
.ico{line-height:0;font-size:1px}.ico .i{width:108px;height:108px;stroke-width:1.1}
.star{display:grid;place-items:center}.star .i{width:26px;height:26px}.star.on .i{fill:currentColor}
.chip i .i{width:12px;height:12px}
.day>span:nth-child(2) .i{width:26px;height:26px}
.grid small{display:flex;align-items:center;gap:7px}.grid small .i{width:18px;height:18px}
.tip b{display:flex;gap:6px;align-items:center;justify-content:center}.tip .i{width:18px;height:18px}
.ib.ok{color:#8affc1;border-color:rgba(138,255,193,.5)}
.ib.warn{color:#ffd166;border-color:rgba(255,209,102,.6);animation:glow 2.2s ease-in-out infinite}
.ib.unk{color:var(--mut)}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(255,209,102,.22)}}
.vb{overflow:hidden;max-height:0;opacity:0;margin-top:0;padding:0 18px;transition:max-height .4s,opacity .3s,margin .3s,padding .3s}
.vb.open{max-height:320px;opacity:1;margin-top:8px;padding:16px 18px}
.vh{display:flex;align-items:center;gap:10px;font-size:16px}.vh .i{width:24px;height:24px}
.vb.w .vh{color:#ffd166}.vb.g .vh{color:#8affc1}
.vb p{margin:8px 0 12px;color:var(--mut);font-size:14px;line-height:1.5}
.va{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}

.orb{left:var(--ox,68%);top:var(--oy,6%);right:auto;transition:opacity 1.2s,top 1.8s cubic-bezier(.4,0,.2,1),left 1.8s cubic-bezier(.4,0,.2,1)}
body.ph-morning{--ox:8%;--oy:48%}body.ph-day{--ox:68%;--oy:6%}body.ph-evening{--ox:76%;--oy:50%}body.ph-night{--ox:66%;--oy:8%}
body.ph-morning .sun{background:radial-gradient(circle,#fff3dc 0,#ffb77a 40%,rgba(255,160,100,0) 70%);box-shadow:0 0 120px 40px rgba(255,170,120,.5)}
body.ph-evening .sun{background:radial-gradient(circle,#ffe9c8 0,#ff8a4a 40%,rgba(255,110,60,0) 70%);box-shadow:0 0 130px 50px rgba(255,110,70,.5)}
.glow{position:absolute;left:-10%;right:-10%;bottom:-10%;height:55%;background:radial-gradient(ellipse at 50% 100%,var(--gl,transparent),transparent 70%);opacity:0;transition:opacity 1.6s}
body.ph-morning .glow{--gl:rgba(255,175,125,.75);opacity:1}body.ph-evening .glow{--gl:rgba(255,100,70,.75);opacity:1}
.seg{margin-top:12px;padding:6px;display:flex;gap:4px;border-radius:99px}
.sb{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border:0;border-radius:99px;background:none;color:#fff;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .25s,box-shadow .25s}
.sb:hover{background:rgba(255,255,255,.14)}
.sb[aria-pressed=true]{background:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.15)}
.sb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.sb .i{width:20px;height:20px}
@media(max-width:560px){.sb span{display:none}.sb[aria-pressed=true]{flex:2.4}.sb[aria-pressed=true] span{display:inline}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mh h2{margin:0}
.mb{display:flex;gap:8px}.ib.sm{width:36px;height:36px}
.mapwrap{position:relative;height:340px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.3);transition:height .4s}
.mapsec.big .mapwrap{height:72vh}
.mapbox{position:absolute;inset:0;background:rgba(255,255,255,.08)}
.mapbox.leaflet-container{font:inherit}
.mload{position:absolute;inset:0;z-index:500;display:grid;place-items:center;text-align:center;padding:20px;color:#fff;background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;transition:opacity .5s}
.mload.hide{opacity:0;pointer-events:none}
.mc{display:flex;gap:12px;align-items:center;margin-top:12px}
.mc input{flex:1;min-width:0;accent-color:#fff;height:28px;cursor:pointer}
.mt{min-width:120px;text-align:right;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.lg{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--mut)}
.lg i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#a9dcff,#3d8bff,#1f4fd1,#7b3fd4,#e0338a)}
.mn{margin-top:8px;font-size:12px;color:var(--mut)}
.radar{transition:opacity .3s}
.pin span{display:block;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #1e7bff;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}80%,100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.gp .leaflet-popup-content-wrapper{background:rgba(15,23,42,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:18px}
.gp .leaflet-popup-tip{background:rgba(15,23,42,.6)}
.gp .leaflet-popup-content{margin:12px 14px}
.pp{display:flex;flex-direction:column;gap:6px;min-width:140px;font-size:14px}
.pt{display:flex;align-items:center;gap:8px}.pt .i{width:30px;height:30px}.pt b{font-size:26px;font-weight:400}
.pp small{color:rgba(255,255,255,.75);display:flex;gap:6px;align-items:center}.pp small .i{width:15px;height:15px}
.pp .btn{margin-top:4px}
.leaflet-container a.leaflet-popup-close-button{display:none}
.ib.act{background:rgba(255,255,255,.4)}
.mapsec.dk .leaflet-base-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.7)}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,30px);opacity:0;z-index:1000;padding:12px 18px;border-radius:18px;max-width:92vw;font-size:14px;text-align:center;pointer-events:none;transition:opacity .4s,transform .4s}.toast.on{opacity:1;transform:translate(-50%,0)}.pn{font-size:16px;font-weight:600}
</style>
</head>
<body>
<div class="sky"><div class="cloud" style="top:8%"></div><div class="cloud"></div><div class="cloud"></div><div class="orb sun"></div><div class="orb moon"></div><div class="glow"></div></div>
<canvas id="fx"></canvas><div class="flash" id="fl"></div>
<main>
 <form class="glass top" id="f" role="search" autocomplete="off">
  <span class="si" data-ic="search"></span>
  <input id="q" placeholder="Знайти місто" aria-label="Місто">
  <button class="ib" type="button" id="aod" hidden aria-label="Погода на екрані блокування та AOD" title="Погода на екрані блокування та AOD"><span data-ic="smartphone"></span></button>
  <button class="ib" type="button" id="vpn" aria-label="Перевірка VPN"></button>
  <button class="ib" type="button" id="loc" aria-label="Моє місцезнаходження"><span data-ic="locate"></span></button>
  <button class="ib" type="button" id="rf" aria-label="Оновити"><span data-ic="refresh"></span></button>
  <button class="ib" type="button" id="u" aria-label="Одиниці виміру">°C</button>
 </form>
 <div class="glass vb" id="vb" role="status"></div>
 <ul class="glass" id="sug" role="listbox"></ul>
 <div class="chips" id="chips"></div>
 <div id="app"><div class="sk"></div><div class="sk"></div></div>
 <p class="foot">Дані: Open-Meteo.com</p>
</main>
<script>
const $=s=>document.querySelector(s);
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICONS={
sun:`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>`,

"cloud-sun-rain":`<path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13"/><path d="M3 20a5 5 0 1 1 8.9-4H13a3 3 0 0 1 2 5.24"/><path d="M11 20v2M7 19v2"/>`,

search:`<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>`,

x:`<path d="M18 6 6 18M6 6l12 12"/>`,

    if(ph==="morning"){c1=mix(c1,"#5b6bd6",.4);c2=mix(c2,"#ffb27a",.5)}

  if(!r.ok){if(r.status===403||r.status===429)revOff=Date.now()+36e5;throw 0}

  if(out.name){revCache[k]=out;const ks=Object.keys(revCache);if(ks.length>100)delete revCache[ks[0]];store.set("rev",revCache)}

   <div class="hl">Макс ${T(dl.temperature_2m_max[0])} · Мін ${T(dl.temperature_2m_min[0])} · Відчувається ${T(c.apparent_temperature)}</div></div>
  <div class="glass seg${cls}" id="seg" role="group" aria-label="Час доби"></div>
  <section class="glass${cls}" style="animation-delay:.1s"><h2 id="ct">Температура за годинами</h2><div class="cw" id="cw"></div><div class="xs"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div></section>
  <section class="glass${cls}" style="animation-delay:.2s"><h2>Прогноз на 8 днів · натисніть на день</h2><div class="days">${dl.time.map((t,i)=>{const l=(dl.temperature_2m_min[i]-mn)/(mx-mn||1)*100,r=(dl.temperature_2m_max[i]-mn)/(mx-mn||1)*100;return`<button class="day" data-i="${i}" aria-pressed="${i===sel}"><span>${i?day(t):"Сьогодні"}</span><span>${ic(w(dl.weather_code[i])[0])}</span><div class="rng"><em style="left:${l}%;right:${100-r}%;animation-delay:${.3+i*.06}s"></em></div><span>${T(dl.temperature_2m_min[i])} / ${T(dl.temperature_2m_max[i])}</span></button>`}).join("")}</div></section>
  <div id="mapslot"></div>
  <section class="glass${cls}" style="animation-delay:.3s"><h2>Деталі</h2><div class="grid">
   <div><small>${ic("droplet")} Вологість</small><b>${c.relative_humidity_2m}%</b></div>
   <div><small>${ic("wind")} Вітер</small><b>${Math.round(c.wind_speed_10m)} м/с</b></div>
   <div><small>${ic("gauge")} Тиск</small><b>${Math.round(c.surface_pressure*.75006)} мм</b></div>
   <div><small>${ic("sun")} УФ-індекс</small><b>${Math.round(dl.uv_index_max[0])}</b></div>
   <div><small>${ic("umbrella")} Опади</small><b>${dl.precipitation_probability_max[0]??0}%</b></div>
   <div><small>${ic("sunrise")} Схід сонця</small><b>${hr(dl.sunrise[0])}</b></div>
   <div><small>${ic("sunset")} Захід сонця</small><b>${hr(dl.sunset[0])}</b></div></div></section>`;
  countUp($("#tp"),unit==="c"?shownTemp:shownTemp*9/5+32,unit==="c"?c.temperature_2m:c.temperature_2m*9/5+32);
  shownTemp=c.temperature_2m;
  drawChart();tilt($("#hero"));drawSeg();mountMap();
  if(window.AndroidAOD)try{AndroidAOD.setPlace(place.name,place.lat,place.lon,unit)}catch(e){}
  $("#st").onclick=toggleFav;
  document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;document.querySelectorAll(".day").forEach(x=>x.setAttribute("aria-pressed",x===b));drawChart()});
}
function countUp(el,from,to){
  if(RM||from===to){el.textContent=Math.round(to)+"°";return}
  const t0=performance.now(),dur=900;
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e)+"°";if(k<1)requestAnimationFrame(f)})(t0);
}
function tilt(el){
  if(RM||!el)return;
  el.onpointermove=e=>{if(e.pointerType==="touch")return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`};
  el.onpointerleave=()=>el.style.transform="";
}

/* ---------- interactive chart ---------- */
function drawChart(){
  const d=data,date=d.daily.time[sel],ix=d.hourly.time.map((t,i)=>i).filter(i=>d.hourly.time[i].startsWith(date));
  const vals=ix.map(i=>d.hourly.temperature_2m[i]),W=600,H=150,pt=34,pb=14,px=12;
  const lo=Math.min(...vals),hi=Math.max(...vals),X=i=>px+i*(W-2*px)/(ix.length-1),Y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  let p=`M${pts[0]}`;for(let i=1;i<pts.length;i++){const cx=(pts[i-1][0]+pts[i][0])/2;p+=`C${cx},${pts[i-1][1]} ${cx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`}
  const nowIdx=sel===0?ix.findIndex(i=>d.hourly.time[i].slice(0,13)===d.current.time.slice(0,13)):-1;
  $("#ct").textContent=(sel?"Температура · "+new Date(date).toLocaleDateString("uk",{weekday:"long",day:"numeric",month:"long"}):"Температура сьогодні");
  $("#cw").innerHTML=`<svg class="ch" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
   <path class="ar" d="${p}L${pts[pts.length-1][0]},${H}L${pts[0][0]},${H}Z" fill="url(#g)"/><path class="ln" pathLength="1" d="${p}"/>
   <line id="vl" y1="${pt-10}" y2="${H}" stroke="#fff" stroke-opacity=".6" stroke-dasharray="3 4"/><circle id="dt" r="6" fill="#fff" stroke="rgba(0,0,0,.2)" stroke-width="2"/></svg><div class="tip" id="tip"></div>`;
  const svg=$("#cw svg"),tip=$("#tip");
  const at=k=>{k=Math.max(0,Math.min(ix.length-1,k));const i=ix[k],x=pts[k][0];
    $("#vl").setAttribute("x1",x);$("#vl").setAttribute("x2",x);$("#dt").setAttribute("cx",x);$("#dt").setAttribute("cy",pts[k][1]);
    tip.style.left=Math.max(14,Math.min(86,x/W*100))+"%";
    tip.innerHTML=`<b>${ic(w(d.hourly.weather_code[i],!d.hourly.is_day[i])[0])}${T(d.hourly.temperature_2m[i])}</b>${hr(d.hourly.time[i])} · ${ic("umbrella")} ${d.hourly.precipitation_probability[i]??0}%`};
  const move=e=>{const r=svg.getBoundingClientRect();at(Math.round(((e.clientX-r.left)/r.width*W-px)/(W-2*px)*(ix.length-1)))};
  svg.onpointermove=move;svg.onpointerdown=move;
  at(nowIdx>=0?nowIdx:12);
}

/* ---------- favourites ---------- */
function renderChips(){
  $("#chips").innerHTML=favs.map((f,i)=>`<div class="chip${place&&f.name===place.name?" on":""}" role="button" tabindex="0" data-i="${i}">${f.name}<i data-x="${i}" aria-label="Видалити ${f.name}">${ic("x")}</i></div>`).join("");
  document.querySelectorAll(".chip").forEach(c=>{
    const go=e=>{const x=e.target.closest("[data-x]");if(x){favs.splice(+x.dataset.x,1);store.set("fav",favs);renderChips();data&&render(false);return}load(favs[+c.dataset.i])};
    c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(e)}};
  });
}
function toggleFav(){
  const i=favs.findIndex(f=>f.name===place.name);
  if(i>=0)favs.splice(i,1);else favs.unshift(place);
  favs=favs.slice(0,6);store.set("fav",favs);renderChips();
  const s=$("#st");s.classList.toggle("on",i<0);
}

/* ---------- search ---------- */
let tm;const sug=$("#sug");
async function suggest(q){
  if(q.length<2){sug.classList.remove("open");return}
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=uk`),rs=(await r.json()).results||[];
    sug.innerHTML=rs.length?rs.map((x,i)=>`<li tabindex="0" role="option" data-i="${i}">${x.name}${x.admin1?", "+x.admin1:""}, ${x.country||""}</li>`).join(""):"<li>Нічого не знайдено</li>";
    sug.classList.add("open");
    const pick=li=>{const x=rs[+li.dataset.i];if(!x)return;sug.classList.remove("open");$("#q").value="";load({name:x.name,lat:x.latitude,lon:x.longitude})};
    sug.onclick=e=>{const li=e.target.closest("li[data-i]");li&&pick(li)};
    sug.onkeydown=e=>{if(e.key==="Enter"){const li=e.target.closest("li[data-i]");li&&pick(li)}};
  }catch(e){sug.innerHTML="<li>Помилка пошуку. Перевірте інтернет.</li>";sug.classList.add("open")}
}
$("#q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>suggest(e.target.value.trim()),300)};
$("#f").onsubmit=e=>{e.preventDefault();suggest($("#q").value.trim()).then(()=>{const f=sug.querySelector("li[data-i]");f&&f.click()})};
document.addEventListener("click",e=>{if(!e.target.closest("#sug,#f"))sug.classList.remove("open")});

/* ---------- VPN check ---------- */
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let vpn={state:"checking"};
function tzOff(z){try{const d=new Date(),str=d.toLocaleString("sv-SE",{timeZone:z}),u=Date.parse(str.replace(" ","T")+"Z");return Math.round((u-Math.floor(d.getTime()/1000)*1000)/9e5)}catch(e){return null}}
async function vpnCheck(){
  vpn={state:"checking"};drawVpn();
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;let i=null;
  try{const r=await fetch("https://api.ipapi.is/",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json(),l=j.location||{};
    i={ip:j.ip,country:l.country,city:l.city,tz:l.timezone,lat:l.latitude,lon:l.longitude,flag:!!(j.is_vpn||j.is_proxy||j.is_tor)}}catch(e){}
  if(!i)try{const r=await fetch("https://ipwho.is/");const j=await r.json();if(j.success===false)throw 0;
    i={ip:j.ip,country:j.country,city:j.city,tz:j.timezone&&j.timezone.id,lat:j.latitude,lon:j.longitude,flag:false}}catch(e){}
  if(!i)vpn={state:"unknown"};
  else{const a=tzOff(i.tz),b=tzOff(tz),mis=a!=null&&b!=null&&a!==b;vpn={...i,state:i.flag?"vpn":mis?"likely":"none",dtz:tz}}
  drawVpn(vpn.state==="vpn"||vpn.state==="likely"?true:undefined);return vpn;
}
function drawVpn(open){
  const s=vpn.state,bad=s==="vpn"||s==="likely",b=$("#vpn"),box=$("#vb");
  b.className="ib "+(bad?"warn":s==="none"?"ok":"unk");
  b.innerHTML=ic(s==="none"?"shield-check":bad?"shield-alert":"shield");
  b.title=bad?"Виявлено VPN":s==="none"?"VPN не виявлено":"Перевірка VPN";
  const where=vpn.ip?`IP ${esc(vpn.ip)} · ${esc([vpn.city,vpn.country].filter(Boolean).join(", "))}`:"";
  let h="",t="",btn="";
  if(s==="checking"){h="Перевіряємо підключення…";t="Це займе кілька секунд."}
  else if(s==="vpn"){h="Виявлено VPN або проксі";t=`${where}. Погода «Моє місце» береться з GPS пристрою, а не з IP, тож VPN на неї не впливає. Але якщо GPS вимкнено, місто доведеться вибрати вручну.`;btn='<button class="btn" data-a="gps">Визначити за GPS</button>'}
  else if(s==="likely"){h="Схоже, ввімкнено VPN";t=`${where}. Часовий пояс за IP не збігається з часовим поясом пристрою (${esc(vpn.dtz)}). Це лише ознака, а не точний результат.`;btn='<button class="btn" data-a="gps">Визначити за GPS</button>'}
  else if(s==="none"){h="VPN не виявлено";t=`${where}.`}
  else{h="Перевірку не виконано";t="Сервіс перевірки недоступний або немає мережі.";btn='<button class="btn" data-a="re">Перевірити знову</button>'}
  box.className="glass vb "+(bad?"w":s==="none"?"g":"")+(box.classList.contains("open")?" open":"");
  box.innerHTML=`<div class="vh">${ic(s==="none"?"shield-check":bad?"shield-alert":"shield")}<b>${h}</b></div><p>${t}</p><div class="va">${btn}<button class="btn" data-a="x">Закрити</button></div>`;
  if(open===true)box.classList.add("open");
}
$("#vb").onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;const k=a.dataset.a;
  if(k==="x")$("#vb").classList.remove("open");
  else if(k==="re")vpnP=vpnCheck();
  else if(k==="gps"){$("#vb").classList.remove("open");geo()}};
$("#vpn").onclick=()=>$("#vb").classList.toggle("open");
addEventListener("online",()=>{vpnP=vpnCheck()});
let vpnP=vpnCheck();

/* ---------- controls ---------- */
$("#u").textContent=unit==="c"?"°C":"°F";
$("#u").onclick=()=>{unit=unit==="c"?"f":"c";store.set("u",unit);$("#u").textContent=unit==="c"?"°C":"°F";data&&render(false)};
$("#rf").onclick=()=>{const b=$("#rf");b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");place&&load(place,true);MP.map&&loadFrames()};
async function fb(){const v=await vpnP;load(v&&v.state==="none"&&v.lat!=null?{name:v.city||"Моє місце",lat:v.lat,lon:v.lon}:FALL)}
function geo(){
  if(!navigator.geolocation)return fb();
  navigator.geolocation.getCurrentPosition(p=>load({name:"Моє місце",lat:p.coords.latitude,lon:p.coords.longitude}),()=>fb(),{timeout:8000});
}
$("#loc").onclick=geo;
document.querySelectorAll("[data-ic]").forEach(e=>e.innerHTML=ic(e.dataset.ic));
function initAod(){
  const b=$("#aod");if(!window.AndroidAOD)return;
  b.hidden=false;
  const sync=()=>{let on=false;try{on=AndroidAOD.isEnabled()}catch(e){}b.classList.toggle("act",on);return on};sync();
  b.onclick=()=>{const want=!sync();try{AndroidAOD.setEnabled(want)}catch(e){return}
    setTimeout(()=>{const on=sync();toast(on?"Погоду додано до сповіщень. Її видно на екрані блокування й AOD залежно від налаштувань Samsung.":want?"Дозвольте сповіщення для застосунку в налаштуваннях телефона.":"Погоду на екрані блокування вимкнено.")},900)};
}
initAod();
renderChips();
const saved=store.get("p",null);saved?load(saved):geo();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
